[workspace]
resolver = "2"
members = ["soroban-fuzzer", "soroban-analyzer", "soroban-budget"]
# Vendored upstream code: kept out of the workspace so that `cargo clippy`,
# `cargo fmt` and the test matrix are not applied to code this project does not
# own. It is still consumed as a path dev-dependency of `soroban-fuzzer`.
exclude = ["third-party/soroban-token-example"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
# soroban-sdk 27 requires 1.91, which is therefore this workspace's floor.
rust-version = "1.91"
description = "Open-source security toolkit for Soroban smart contracts"
repository = "https://github.com/soroban-security/soroban-toolkit"

[workspace.dependencies]
soroban-sdk = { version = "27.0.6", features = ["testutils"] }
proptest = "1.11"
proptest-state-machine = "0.8"
arbitrary = { version = "1.3.2", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The Wasm reader used by the budget estimator. The version is the one `soroban-sdk`
# already resolves to through `soroban-env-host`, so the estimator and the host agree
# about the format by construction rather than by review.
wasmparser = "0.116"

# Soroban contracts are deployed with overflow checks enabled (the soroban-sdk
# template sets this for release builds). Keep the same setting here so that
# arithmetic findings reproduce under `cargo test --release`.
[profile.release]
opt-level = 3
overflow-checks = true
